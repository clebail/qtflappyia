<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70c5ce"/>
      <stop offset="1" stop-color="#4a97a8"/>
    </linearGradient>
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffe45e"/>
      <stop offset="1" stop-color="#f5c211"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
  </defs>

  <!-- Fond ciel arrondi -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#sky)"/>

  <!-- ===== Réseau de neurones (cerveau du piaf) ===== -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.2" fill="none">
    <!-- couche entrée (3) -> couche cachée (2) -->
    <line x1="158" y1="74"  x2="200" y2="104"/>
    <line x1="158" y1="74"  x2="200" y2="168"/>
    <line x1="158" y1="128" x2="200" y2="104"/>
    <line x1="158" y1="128" x2="200" y2="168"/>
    <line x1="158" y1="182" x2="200" y2="104"/>
    <line x1="158" y1="182" x2="200" y2="168"/>
    <!-- couche cachée (2) -> sortie (1) -->
    <line x1="200" y1="104" x2="236" y2="136"/>
    <line x1="200" y1="168" x2="236" y2="136"/>
  </g>

  <!-- "Capteurs" : du piaf vers la couche d'entrée -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5">
    <line x1="120" y1="118" x2="158" y2="74"/>
    <line x1="126" y1="138" x2="158" y2="128"/>
    <line x1="120" y1="158" x2="158" y2="182"/>
  </g>

  <!-- Noeuds du réseau -->
  <g fill="#ffffff" stroke="#2b3a55" stroke-width="2.5">
    <circle cx="158" cy="74"  r="10"/>
    <circle cx="158" cy="128" r="10"/>
    <circle cx="158" cy="182" r="10"/>
    <circle cx="200" cy="104" r="11"/>
    <circle cx="200" cy="168" r="11"/>
  </g>
  <!-- Noeud de sortie mis en valeur (décision : battre des ailes) -->
  <circle cx="236" cy="136" r="12" fill="#ff7a33" stroke="#2b3a55" stroke-width="2.5"/>

  <!-- ===== Le piaf ===== -->
  <g stroke="#2b3a55" stroke-width="3">
    <!-- corps -->
    <circle cx="86" cy="140" r="46" fill="url(#body)"/>
    <!-- ventre -->
    <ellipse cx="80" cy="160" rx="28" ry="20" fill="url(#belly)" stroke="none"/>
    <!-- aile -->
    <path d="M 58 138 q -22 4 -28 22 q 22 8 36 -2 z" fill="#f0a500"/>
    <!-- oeil -->
    <circle cx="104" cy="122" r="16" fill="#ffffff"/>
    <circle cx="109" cy="124" r="7" fill="#2b3a55"/>
    <!-- bec -->
    <path d="M 118 138 l 26 4 l -24 14 z" fill="#ff7a33"/>
  </g>
</svg>
